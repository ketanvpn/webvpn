                    type: string
                    nullable: true
                  url:
                    type: string
                    nullable: true
    delete:
      operationId: unlinkTelegram
      tags: [auth]
      summary: Unlink Telegram from current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean

  # ─── Servers (public) ──────────────────────────────────────────────────
  /servers:
    get:
      operationId: listServers
      tags: [servers]
