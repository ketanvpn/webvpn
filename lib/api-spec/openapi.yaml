      tags: [admin]
      summary: Update voucher (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVoucherBody"
      responses:
        "200":
          description: Updated voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
    delete:
      operationId: adminDeleteVoucher
      tags: [admin]
      summary: Delete voucher (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /vouchers/validate:
    post:
      operationId: validateVoucher
      tags: [orders]
      summary: Validate a voucher code
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateVoucherBody"
      responses:
        "200":
          description: Valid voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateVoucherResponse"
        "400":
          description: Invalid or expired voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Bug Presets ──────────────────────────────────────────────────────
  /bug-presets:
    get:
      operationId: listBugPresets
      tags: [bug-presets]
      summary: List all active bug presets for users
      responses:
        "200":
          description: List of bug presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BugPreset"

  /admin/bug-presets:
    get:
      operationId: adminListBugPresets
      tags: [admin]
      summary: List all bug presets (admin)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of bug presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BugPreset"
    post:
      operationId: adminCreateBugPreset
      tags: [admin]
      summary: Create a new bug preset (admin)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBugPresetBody"
      responses:
        "201":
          description: Bug preset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugPreset"

  /admin/bug-presets/{id}:
    put:
      operationId: adminUpdateBugPreset
      tags: [admin]
      summary: Update a bug preset (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBugPresetBody"
      responses:
        "200":
          description: Bug preset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugPreset"
    delete:
      operationId: adminDeleteBugPreset
      tags: [admin]
      summary: Delete a bug preset (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bug preset deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ─── Easy Inject Presets ──────────────────────────────────────────────
  /easy-inject-presets:
    get:
      operationId: listActiveEasyInjectPresets
      tags: [easy-inject-presets]
      summary: List active Easy Inject presets for authenticated users
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active presets in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyInjectPreset"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/easy-inject-presets:
    get:
      operationId: adminListEasyInjectPresets
      tags: [admin, easy-inject-presets]
      summary: List all Easy Inject presets (admin)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All presets in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEasyInjectPreset"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: adminCreateEasyInjectPreset
      tags: [admin, easy-inject-presets]
      summary: Create an Easy Inject preset (admin)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEasyInjectPresetBody"
      responses:
        "201":
          description: Preset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEasyInjectPreset"
        "400":
          description: Invalid preset configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/easy-inject-presets/{id}:
    patch:
      operationId: adminPatchEasyInjectPreset
      tags: [admin, easy-inject-presets]
      summary: Update or activate/deactivate an Easy Inject preset (admin)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EasyInjectPresetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEasyInjectPresetBody"
      responses:
        "200":
          description: Current preset; unchanged valid patches do not increment version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEasyInjectPreset"
        "400":
          description: Invalid id, empty patch, or invalid preset configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          description: Preset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Unique identity conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteEasyInjectPreset
      tags: [admin, easy-inject-presets]
      summary: Delete a custom Easy Inject preset (admin)
      description: Built-in presets cannot be deleted and must be deactivated instead.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EasyInjectPresetId"
      responses:
        "200":
          description: Custom preset deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEasyInjectPresetResponse"
        "400":
          description: Invalid preset id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Preset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Built-in preset; deactivate it instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/easy-inject-presets/{id}/revisions:
    get:
      operationId: adminListEasyInjectPresetRevisions
      tags: [admin, easy-inject-presets]
      summary: List revision snapshots for an Easy Inject preset (admin)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EasyInjectPresetId"
      responses:
        "200":
          description: Revisions ordered newest version first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyInjectPresetRevision"
        "400":
          description: Invalid preset id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Preset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/easy-inject-presets/{id}/revisions/{revisionId}/restore:
    post:
      operationId: adminRestoreEasyInjectPresetRevision
      tags: [admin, easy-inject-presets]
      summary: Restore an Easy Inject preset revision into a new version (admin)
      description: Preserves the preset id, slug, and built-in identity while creating a new version.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EasyInjectPresetId"
        - $ref: "#/components/parameters/EasyInjectPresetRevisionId"
      responses:
        "200":
          description: Revision restored as a newly incremented preset version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEasyInjectPreset"
        "400":
          description: Invalid preset or revision id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Preset or revision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stored revision cannot be restored safely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    DynamicVpnServerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    DynamicVpnOrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    EasyInjectPresetId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    EasyInjectPresetRevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    BalanceLog:
      type: object
      required: [id, userId, type, amount, balanceBefore, balanceAfter, description, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
          nullable: true
        type:
          type: string
          description: "Jenis transaksi: topup | order | adjustment | refund"
        amount:
          type: number
          description: "Jumlah perubahan (positif = masuk, negatif = keluar)"
        balanceBefore:
          type: number
        balanceAfter:
          type: number
        description:
          type: string
        relatedId:
          type: integer
          nullable: true
          description: "ID topup atau order terkait"
        createdAt:
          type: string
          format: date-time

    BalanceLogList:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BalanceLog"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PaymentSettings:
      type: object
      properties:
        qrisStaticUrl:
          type: string
          format: uri
          pattern: ^https://
          nullable: true
          description: URL HTTPS gambar QRIS statis untuk topup manual (legacy)
        qrisEnabled:
          type: boolean
          description: Aktifkan metode QRIS statis legacy
        qrisExpiryMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          nullable: true
          description: Durasi pembayaran berlaku dalam menit (default 15)
        paymentFallbackEnabled:
          type: boolean
          description: Coba channel aktif berikutnya sesuai paymentChannelOrder bila channel sebelumnya gagal
        paymentChannelOrder:
          type: array
          minItems: 1
          maxItems: 3
          description: Urutan prioritas channel pembayaran; backend menambahkan channel yang belum disebutkan dalam urutan default
          items:
            type: string
            enum: [ketantechpay, autogopay_gopay, autogopay_shopeepay]
        autoGopayEnabled:
          type: boolean
          description: Kompatibilitas legacy; bernilai true bila GoPay atau ShopeePay AutoGoPay aktif
        autoGopayApiUrl:
          type: string
          format: uri
          pattern: ^https://
          nullable: true
          description: Base URL HTTPS bersama untuk channel AutoGoPay
        autoGopayMerchantId:
          type: string
          nullable: true
          description: Merchant ID AutoGoPay (legacy)
        autoGopaySecretKey:
          type: string
          nullable: true
          description: API Key bersama AutoGoPay (untuk auth dan verifikasi webhook)
        autoGopayCallbackToken:
          type: string
          nullable: true
          description: Token verifikasi callback/webhook AutoGoPay (legacy)
        autoGopayGopayEnabled:
          type: boolean
          description: Aktifkan channel GoPay melalui AutoGoPay
        autoGopayShopeePayEnabled:
          type: boolean
          description: Aktifkan channel ShopeePay melalui AutoGoPay
        autoGopayShopeePayQrisStatic:
          type: string
          nullable: true
          description: String payload QRIS statis ShopeePay; OVO tetap memindai payload ini sebagai QRIS, bukan menjadi channel OVO terpisah
        activeGateway:
          type: string
          nullable: true
          description: Gateway aktif legacy yang disinkronkan dari channel pertama yang aktif
          enum: [qris_static, autogopay, ketantechpay]
        ketantechPayEnabled:
          type: boolean
          description: Aktifkan channel KetantechPay
        ketantechPayWebhookSecret:
          type: string
          nullable: true
          description: Webhook Secret KetantechPay
        ketantechPayBaseUrl:
          type: string
          format: uri
          pattern: ^https://
          nullable: true
          description: Base URL HTTPS KetantechPay
        ketantechPayClientKey:
          type: string
          nullable: true
          description: Client API Key KetantechPay

    TelegramSettings:
      type: object
      properties:
        telegramBotToken:
          type: string
          nullable: true
          description: Telegram Bot API token dari BotFather
        telegramAdminChatId:
          type: string
          nullable: true
          description: Chat ID Telegram admin untuk menerima notifikasi
        telegramEnabled:
          type: boolean
          description: Aktifkan notifikasi Telegram
        telegramBotUsername:
          type: string
          nullable: true
          description: Username bot (auto-detect)

    ResellerSettings:
      type: object
      properties:
        resellerEnabled:
          type: boolean
          description: Aktifkan fitur harga khusus reseller
        resellerDiscountPercent:
          type: integer
          description: Persentase diskon untuk reseller (0-100)
        resellerTargetEnabled:
          type: boolean
          description: Aktifkan sistem target penjualan bulanan
        resellerMonthlyTarget:
          type: integer
          description: Target penjualan bulanan dalam rupiah

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        replacement:
          type: string

    RetiredRouteResponse:
      type: object
      required: [status, error, replacement]
      properties:
        status:
          type: integer
          enum: [410]
        error:
          type: string
        replacement:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ─── Dynamic VPN ───────────────────────────────────────────────────────
    DynamicDurationType:
      type: string
      enum: [day, week, month]

    DynamicVpnProtocol:
      type: string
      enum: [ssh, vmess, vless, trojan]

    DynamicVpnServer:
      type: object
      required:
        [id, provider, displayName, enabledProtocols, supportedTypes, isActive, trialEnabled, renewEnabled, sellPricePerDay, sellPricePerWeek, sellPricePerMonth, minDays, maxDays, minMonths, maxMonths, capacityUsed, capacityIsFull, maxConnections, sortOrder]
      properties:
        id:
          type: integer
        provider:
          type: string
          enum: [nadiavpn, local_panel]
        displayName:
          type: string
        location:
          type: string
          nullable: true
        enabledProtocols:
          type: array
          items:
            $ref: "#/components/schemas/DynamicVpnProtocol"
        supportedTypes:
          type: array
          items:
            $ref: "#/components/schemas/DynamicDurationType"
        isActive:
          type: boolean
        trialEnabled:
          type: boolean
        trialDuration:
          type: string
          nullable: true
        renewEnabled:
          type: boolean
        sellPricePerDay:
          type: number
        sellPricePerWeek:
          type: number
        sellPricePerMonth:
          type: number
        minDays:
          type: integer
        maxDays:
          type: integer
        minMonths:
          type: integer
        maxMonths:
          type: integer
        capacityLimit:
          type: string
          nullable: true
        capacityUsed:
          type: integer
        capacityIsFull:
          type: boolean
        maxConnections:
          type: integer
        sortOrder:
          type: integer

    DynamicVpnServerListResponse:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/DynamicVpnServer"

    AdminDynamicVpnServer:
      allOf:
        - $ref: "#/components/schemas/DynamicVpnServer"
        - type: object
          required: [providerServerId, providerName, supportedProtocols, providerTrialEnabled, costPerDay, costPerWeek, costPerMonth, pricingMode, markupPercent, lastSyncedAt, createdAt, updatedAt]
          properties:
            providerServerId:
              type: string
            providerName:
              type: string
            supportedProtocols:
              type: array
              items:
                $ref: "#/components/schemas/DynamicVpnProtocol"
            providerTrialEnabled:
              type: boolean
            costPerDay:
              type: number
            costPerWeek:
              type: number
            costPerMonth:
              type: number
            pricingMode:
              type: string
              enum: [auto_markup, manual]
            markupPercent:
              type: integer
            lastSyncedAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    AdminDynamicVpnServerListResponse:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/AdminDynamicVpnServer"

    AdminDynamicVpnServerSyncResponse:
      type: object
      required: [success, total, servers]
      properties:
        success:
          type: boolean
        total:
          type: integer
        servers:
          type: array
          items:
            $ref: "#/components/schemas/AdminDynamicVpnServer"

    UpdateDynamicVpnServerBody:
      type: object
      properties:
        displayName:
          type: string
        isActive:
          type: boolean
        trialEnabled:
          type: boolean
        enabledProtocols:
          type: array
          items:
            $ref: "#/components/schemas/DynamicVpnProtocol"
        sellPricePerDay:
          type: number
          minimum: 0
        sellPricePerWeek:
          type: number
          minimum: 0
        sellPricePerMonth:
          type: number
          minimum: 0
        minDays:
          type: integer
          minimum: 1
        maxDays:
          type: integer
          minimum: 1
        minMonths:
          type: integer
          minimum: 1
        maxMonths:
          type: integer
          minimum: 1
        maxConnections:
          type: integer
          minimum: 0
        sortOrder:
          type: integer
        pricingMode:
          type: string
          enum: [auto_markup, manual]
        markupPercent:
          type: integer
          minimum: 0
          maximum: 1000

    DynamicVpnQuoteBody:
      type: object
      required: [serverId, protocol, durationType, duration]
      properties:
        serverId:
          type: integer
        protocol:
          $ref: "#/components/schemas/DynamicVpnProtocol"
        durationType:
          $ref: "#/components/schemas/DynamicDurationType"
        duration:
          type: integer
          minimum: 1
        voucherCode:
          type: string

    DynamicVpnQuote:
      type: object
      required: [unitPrice, baseAmount, durationLabel, amount, resellerDiscountAmount, voucherDiscountAmount, discountAmount, voucherId, voucherCode]
      properties:
        unitPrice:
          type: number
        baseAmount:
          type: number
        durationLabel:
          type: string
        amount:
          type: number
        resellerDiscountAmount:
          type: number
        voucherDiscountAmount:
          type: number
        discountAmount:
          type: number
        voucherId:
          type: integer
          nullable: true
        voucherCode:
          type: string
          nullable: true

    CreateDynamicVpnOrderBody:
      type: object
      required: [serverId, protocol, durationType, duration, username]
      properties:
        serverId:
          type: integer
        protocol:
          $ref: "#/components/schemas/DynamicVpnProtocol"
        durationType:
          $ref: "#/components/schemas/DynamicDurationType"
        duration:
          type: integer
          minimum: 1
        username:
          type: string
          minLength: 5
          pattern: '^(?=.*[a-z])(?=(?:.*\d){2,})[a-zA-Z0-9]+$'
        password:
          type: string
          minLength: 6
          maxLength: 32
          description: Required for SSH orders; not returned in user order responses.
        paymentMethod:
          type: string
          enum: [balance]
          default: balance
        voucherCode:
          type: string

    DynamicVpnOrder:
      type: object
      required: [id, userId, dynamicServerId, provider, providerServerId, serverDisplayName, protocol, durationType, duration, username, amount, voucherId, discountAmount, status, paymentMethod, vpnAccountId, providerAccountId, qrisUrl, expiresAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        dynamicServerId:
          type: integer
          nullable: true
        provider:
          type: string
        providerServerId:
          type: string
        serverDisplayName:
          type: string
        protocol:
          $ref: "#/components/schemas/DynamicVpnProtocol"
        durationType:
          $ref: "#/components/schemas/DynamicDurationType"
        duration:
          type: integer
        username:
          type: string
        amount:
          type: number
        voucherId:
          type: integer
          nullable: true
        discountAmount:
          type: number
        status:
          type: string
          enum: [pending, processing, paid, failed, expired]
        paymentMethod:
          type: string
        vpnAccountId:
          type: integer
          nullable: true
        providerAccountId:
          type: string
          nullable: true
        qrisUrl:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DynamicVpnOrderResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/DynamicVpnOrder"

    DynamicVpnOrderListResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/DynamicVpnOrder"

    AdminDynamicVpnOrder:
      allOf:
        - $ref: "#/components/schemas/DynamicVpnOrder"
        - type: object
          required: [buyer, voucherCode]
          properties:
            buyer:
              type: object
              required: [username, email]
              properties:
                username:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
            voucherCode:
              type: string
              nullable: true

    AdminDynamicVpnOrderListResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AdminDynamicVpnOrder"

    CreateDynamicVpnOrderResponse:
      type: object
      required: [order, quote, reused]
      properties:
        order:
          $ref: "#/components/schemas/DynamicVpnOrder"
        quote:
          $ref: "#/components/schemas/DynamicVpnQuote"
        reused:
          type: boolean

    DynamicRenewalBody:
      type: object
      required: [durationType, duration]
      properties:
        durationType:
          $ref: "#/components/schemas/DynamicDurationType"
        duration:
          type: integer
          minimum: 1

    DynamicRenewalQuote:
      type: object
      required: [amount, baseAmount, resellerDiscountAmount, unitPrice, durationType, duration, durationLabel]
      properties:
        amount:
          type: number
        baseAmount:
          type: number
        resellerDiscountAmount:
          type: number
        unitPrice:
          type: number
        durationType:
          $ref: "#/components/schemas/DynamicDurationType"
        duration:
          type: integer
        durationLabel:
          type: string

    DynamicRenewalResponse:
      type: object
      required: [account, amount, discountAmount]
      properties:
        account:
          $ref: "#/components/schemas/VpnAccount"
        amount:
          type: number
        discountAmount:
          type: number

    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string

    # ─── Auth ─────────────────────────────────────────────────────────────
    RegisterBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6
        email:
          type: string
          format: email
        fullName:
          type: string
        whatsapp:
          type: string
        otpCode:
          type: string

    LoginBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, username, email, role, balance, isActive, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, reseller, admin]
        balance:
          type: number
          description: Balance in IDR
        isActive:
          type: boolean
        referralCode:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
          description: Nomor WhatsApp user
        telegramId:
          type: integer
          nullable: true
          description: Telegram user ID (linked)
        telegramUsername:
          type: string
          nullable: true
          description: Username Telegram user
        referredBy:
          type: string
          nullable: true
          description: Kode referral yang digunakan saat daftar
        createdAt:
          type: string
          format: date-time

    # ─── Products ─────────────────────────────────────────────────────────
    Product:
      type: object
      required: [id, name, protocol, durationDays, price, isActive, stock, availableStock]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        protocol:
          type: string
          enum: [ssh, vmess, vless, trojan, shadowsocks]
        durationDays:
          type: integer
        price:
          type: number
        quota:
          type: number
          nullable: true
          description: Bandwidth quota in GB, null = unlimited
        maxConnections:
          type: integer
          nullable: true
        stock:
          type: integer
          description: Batas maksimal akun aktif untuk produk ini
        availableStock:
          type: integer
          description: Sisa stok yang masih tersedia (stock - akun aktif)
        resellerPrice:
          type: number
          nullable: true
          description: Harga khusus reseller (null jika user bukan reseller atau fitur reseller nonaktif)
        isActive:
          type: boolean
        category:
          type: string
          nullable: true
        sortOrder:
          type: integer
        serverId:
          type: integer
          nullable: true
          description: ID server yang di-pin untuk produk ini (null = pilih otomatis)
        serverName:
          type: string
          nullable: true
          description: Nama server yang di-pin (null jika tidak di-pin)

    # ─── Orders ───────────────────────────────────────────────────────────
    Order:
      type: object
      required: [id, userId, productId, status, amount, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        productId:
          type: integer
        product:
          $ref: "#/components/schemas/Product"
          nullable: true
        status:
          type: string
          enum: [pending, processing, paid, failed, expired]
          description: processing berarti pembayaran sudah diterima dan akun VPN sedang dibuat
        amount:
          type: number
          description: Harga dasar order dalam IDR, sebelum kode unik
        vpnAccountId:
          type: integer
          nullable: true
        paymentMethod:
          type: string
          nullable: true
        paymentProvider:
          type: string
          nullable: true
          enum: [ketantechpay, autogopay]
          description: Penyedia pembayaran yang memproses transaksi; null untuk pembayaran saldo atau QRIS statis legacy
        paymentChannel:
          type: string
          nullable: true
          enum: [ketantechpay, autogopay_gopay, autogopay_shopeepay]
          description: "Channel pembayaran: ketantechpay = QRIS dinamis KetantechPay; autogopay_gopay = QRIS dinamis melalui channel GoPay AutoGoPay; autogopay_shopeepay = QRIS melalui channel ShopeePay AutoGoPay. QRIS interoperabel dapat dipindai dengan GoPay, OVO, ShopeePay, atau aplikasi QRIS lain; OVO bukan channel yang dipilih secara terpisah."
        payableAmount:
          type: number
          nullable: true
          description: Jumlah aktual dalam IDR yang harus dibayar, termasuk kode unik jika ada; gunakan amount bila null
        uniqueCode:
          type: integer
          nullable: true
          minimum: 0
          description: Tambahan kode unik pada payableAmount; setelah pembayaran berhasil nilai kode unik dikreditkan ke saldo pengguna
        notes:
          type: string
          nullable: true
        qrisUrl:
          type: string
          nullable: true
          description: URL gambar QRIS untuk paymentMethod=qris
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu kedaluwarsa pembayaran QRIS
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderListResponse:
      type: object
      required: [orders, total]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer

    AdminOrderListResponse:
      type: object
      required: [orders, total]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrder"
        total:
          type: integer

    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
              nullable: true

    # ─── Balance / Topup ──────────────────────────────────────────────────
    BalanceResponse:
      type: object
      required: [balance]
      properties:
        balance:
          type: number
        pendingTopup:
          type: number

    TopupBody:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 10000
          description: Amount in IDR (minimum 10,000)

    TopupResponse:
      type: object
      required: [id, amount, qrisUrl, status]
      properties:
        id:
          type: integer
        amount:
          type: number
          description: Nominal saldo yang diminta dalam IDR, sebelum kode unik
        paymentProvider:
          type: string
          nullable: true
          enum: [ketantechpay, autogopay]
          description: Penyedia pembayaran yang memproses topup; null untuk QRIS statis legacy
        paymentChannel:
          type: string
          nullable: true
          enum: [ketantechpay, autogopay_gopay, autogopay_shopeepay]
          description: "Channel pembayaran: ketantechpay = QRIS dinamis KetantechPay; autogopay_gopay = QRIS dinamis melalui channel GoPay AutoGoPay; autogopay_shopeepay = QRIS melalui channel ShopeePay AutoGoPay. Semua QRIS interoperabel dapat dipindai dengan GoPay, OVO, ShopeePay, atau aplikasi QRIS lain; OVO bukan pilihan channel terpisah."
        payableAmount:
          type: number
          nullable: true
          description: Jumlah aktual dalam IDR yang harus dibayar, termasuk kode unik jika ada; gunakan amount bila null
        uniqueCode:
          type: integer
          nullable: true
          minimum: 0
          description: Tambahan kode unik pada payableAmount; setelah pembayaran berhasil nilai kode unik dikreditkan ke saldo pengguna
        qrisUrl:
          type: string
          nullable: true
          description: URL gambar pembayaran QRIS
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu kedaluwarsa pembayaran QRIS
        gateway:
          type: string
          nullable: true
          enum: [qris_static, autogopay, ketantechpay]
          description: Metadata gateway legacy; gunakan paymentProvider dan paymentChannel untuk integrasi baru
        status:
          type: string
          enum: [pending, confirmed, rejected]

    TopupTransaction:
      type: object
      required: [id, userId, amount, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
          nullable: true
        amount:
          type: number
          description: Nominal saldo yang diminta dalam IDR, sebelum kode unik
        paymentProvider:
          type: string
          nullable: true
          enum: [ketantechpay, autogopay]
          description: Penyedia pembayaran yang memproses topup; null untuk QRIS statis legacy
        paymentChannel:
          type: string
          nullable: true
          enum: [ketantechpay, autogopay_gopay, autogopay_shopeepay]
          description: "Channel pembayaran: ketantechpay = QRIS dinamis KetantechPay; autogopay_gopay = QRIS dinamis melalui channel GoPay AutoGoPay; autogopay_shopeepay = QRIS melalui channel ShopeePay AutoGoPay. Semua QRIS interoperabel dapat dipindai dengan GoPay, OVO, ShopeePay, atau aplikasi QRIS lain; OVO bukan pilihan channel terpisah."
        payableAmount:
          type: number
          nullable: true
          description: Jumlah aktual dalam IDR yang harus dibayar, termasuk kode unik jika ada; gunakan amount bila null
        uniqueCode:
          type: integer
          nullable: true
          minimum: 0
          description: Tambahan kode unik pada payableAmount; setelah pembayaran berhasil nilai kode unik dikreditkan ke saldo pengguna
        qrisUrl:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu kedaluwarsa pembayaran QRIS
        gateway:
          type: string
          nullable: true
          enum: [qris_static, autogopay, ketantechpay]
          description: Metadata gateway legacy; gunakan paymentProvider dan paymentChannel untuk integrasi baru
        status:
          type: string
          enum: [pending, confirmed, rejected]
        confirmedBy:
          type: integer
          nullable: true
        rejectionNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── VPN Accounts ─────────────────────────────────────────────────────
    VpnAccount:
      type: object
      required: [id, userId, orderId, dynamicOrder, protocol, username, serverId, server, configLink, allLinks, expiresAt, quota, usedQuota, productName, isActive, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        orderId:
          type: integer
          nullable: true
        dynamicOrder:
          type: object
          nullable: true
          required: [id, provider, providerServerId, serverDisplayName, providerAccountId, dynamicServerId, renewEnabled, supportedTypes, sellPricePerDay, sellPricePerWeek, sellPricePerMonth]
          properties:
            id:
              type: integer
            provider:
              type: string
            providerServerId:
              type: string
            serverDisplayName:
              type: string
            providerAccountId:
              type: string
              nullable: true
            dynamicServerId:
              type: integer
              nullable: true
            renewEnabled:
              type: boolean
            supportedTypes:
              type: array
              items:
                $ref: "#/components/schemas/DynamicDurationType"
            sellPricePerDay:
              type: number
            sellPricePerWeek:
              type: number
            sellPricePerMonth:
              type: number
        protocol:
          type: string
          enum: [ssh, vmess, vless, trojan, shadowsocks]
        username:
          type: string
        password:
          type: string
          nullable: true
        uuid:
          type: string
          nullable: true
        serverId:
          type: integer
        server:
          $ref: "#/components/schemas/PublicServer"
          nullable: true
        configLink:
          type: string
          nullable: true
          description: Primary config link (TLS)
        allLinks:
          type: object
          nullable: true
          description: All config link variants (tls, none, grpc, uptls, upntls)
          additionalProperties:
            type: string
            nullable: true
        expiresAt:
          type: string
          format: date-time
        quota:
          type: number
          nullable: true
        usedQuota:
          type: number
          nullable: true
        productName:
          type: string
          nullable: true
          description: Nama paket produk yang dibeli
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AdminVpnAccountSyncResponse:
      type: object
      required: [success, panelInfo, account]
      properties:
        success:
          type: boolean
        panelInfo:
          type: object
          properties:
            username:
              type: string
            uuid:
              type: string
            hostname:
              type: string
            expired:
              type: string
            configLink:
              type: string
            allLinks:
              type: object
              additionalProperties:
                type: string
                nullable: true
        account:
          type: object
          required: [id, uuid, configLink]
          properties:
            id:
              type: integer
            uuid:
              type: string
              nullable: true
            configLink:
              type: string
              nullable: true

    # ─── Servers ──────────────────────────────────────────────────────────
    PublicServer:
      type: object
      required: [id, name, location, flag, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        host:
          type: string
          nullable: true
        location:
          type: string
        flag:
          type: string
          description: Country flag emoji or code
        isActive:
          type: boolean

    VpnServer:
      allOf:
        - $ref: "#/components/schemas/PublicServer"
        - type: object
          required: [host, supportedProtocols]
          properties:
            host:
              type: string
            apiUrl:
              type: string
              nullable: true
            apiToken:
              type: string
              nullable: true
            supportedProtocols:
              type: array
              items:
                type: string
            activeAccounts:
              type: integer
              nullable: true
            maxAccounts:
              type: integer
              nullable: true
              description: Kapasitas maksimum akun aktif di server ini

    CreateServerBody:
      type: object
      required: [name, location, flag, host, supportedProtocols]
      properties:
        name:
          type: string
        location:
          type: string
        flag:
          type: string
        host:
          type: string
        apiUrl:
          type: string
        apiToken:
          type: string
        supportedProtocols:
          type: array
          items:
            type: string
        isActive:
          type: boolean
          default: true
        maxAccounts:
          type: integer
          description: Kapasitas maksimum akun aktif di server ini
          default: 500

    UpdateServerBody:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        flag:
          type: string
        host:
          type: string
        apiUrl:
          type: string
        apiToken:
          type: string
        supportedProtocols:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        maxAccounts:
          type: integer
          description: Kapasitas maksimum akun aktif di server ini

    # ─── Dashboard ────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [balance, activeAccounts, totalOrders, recentOrders]
      properties:
        balance:
          type: number
        activeAccounts:
          type: integer
        totalOrders:
          type: integer
        pendingTopup:
          type: number
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        expiringAccounts:
          type: array
          items:
            $ref: "#/components/schemas/VpnAccount"
          description: Accounts expiring within 3 days

    AdminDashboard:
      type: object
      required: [totalUsers, totalOrders, totalRevenue, activeAccounts, pendingTopups, pendingOrders, recentOrders, recentTopups]
      properties:
        totalUsers:
          type: integer
        totalOrders:
          type: integer
        totalRevenue:
          type: number
        activeAccounts:
          type: integer
        pendingTopups:
          type: integer
        pendingOrders:
          type: integer
        revenueToday:
          type: number
        revenueThisMonth:
          type: number
        ordersByProtocol:
          type: array
          items:
            type: object
            required: [protocol, count]
            properties:
              protocol:
                type: string
              count:
                type: integer
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrder"
        recentTopups:
          type: array
          items:
            $ref: "#/components/schemas/TopupTransaction"

    AdminUserListResponse:
      type: object
      required: [users, total]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer

    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            orders:
              type: array
              items:
                $ref: "#/components/schemas/Order"
            accounts:
              type: array
              items:
                $ref: "#/components/schemas/VpnAccount"
            topupHistory:
              type: array
              items:
                $ref: "#/components/schemas/TopupTransaction"

    AdminAccountListResponse:
      type: object
      required: [accounts, total]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AdminVpnAccount"
        total:
          type: integer

    AdminVpnAccount:
      allOf:
        - $ref: "#/components/schemas/VpnAccount"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
              nullable: true

    AdminUpdateUserBody:
      type: object
      properties:
        balance:
          type: number
        isActive:
          type: boolean
        role:
          type: string
          enum: [user, reseller, admin]
        adjustBalance:
          type: number
          description: Add/subtract from balance (positive = add, negative = subtract)

    Voucher:
      type: object
      required: [id, code, discountType, discountValue, currentUses, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        code:
          type: string
        discountType:
          type: string
          enum: [percent, fixed]
        discountValue:
          type: number
        maxUses:
          type: integer
          nullable: true
        currentUses:
          type: integer
        isActive:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateVoucherBody:
      type: object
      required: [code, discountType, discountValue]
      properties:
        code:
          type: string
        discountType:
          type: string
          enum: [percent, fixed]
        discountValue:
          type: number
        maxUses:
          type: integer
          nullable: true
        isActive:
          type: boolean
          default: true
        expiresAt:
          type: string
          format: date-time
          nullable: true

    UpdateVoucherBody:
      type: object
      properties:
        code:
          type: string
        discountType:
          type: string
          enum: [percent, fixed]
        discountValue:
          type: number
        maxUses:
          type: integer
          nullable: true
        isActive:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true

    ValidateVoucherBody:
      type: object
      required: [code, productId]
      properties:
        code:
          type: string
        productId:
          type: integer

    ValidateVoucherResponse:
      type: object
      required: [valid, discountAmount, finalPrice]
      properties:
        valid:
          type: boolean
        discountAmount:
          type: number
        finalPrice:
          type: number
        message:
          type: string

    # ─── Bug Presets ──────────────────────────────────────────────────────
    BugPreset:
      type: object
      required: [id, name, bugDomain, mode, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        bugDomain:
          type: string
        mode:
          type: string
          enum: [wildcard, sni, host]
        isActive:
          type: boolean
        sshInjectConfig:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBugPresetBody:
      type: object
      required: [name, bugDomain, mode]
      properties:
        name:
          type: string
        bugDomain:
          type: string
        mode:
          type: string
          enum: [wildcard, sni, host]
        isActive:
          type: boolean
          default: true
        sshInjectConfig:
          type: object
          additionalProperties: true

    UpdateBugPresetBody:
      type: object
      properties:
        name:
          type: string
        bugDomain:
          type: string
        mode:
          type: string
          enum: [wildcard, sni, host]
        isActive:
          type: boolean
        sshInjectConfig:
          type: object
          additionalProperties: true

    # ─── Easy Inject Presets ──────────────────────────────────────────────
    EasyInjectPreset:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - accountLabel
        - requiredAccountKind
        - sshPort
        - mode
        - proxyHost
        - proxyPort
        - payload
        - sniPolicy
        - customSni
        - usePayload
        - ssl
        - supportsDarkTunnel
        - supportsHttpCustom
        - version
      properties:
        id:
          type: integer
          minimum: 1
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 1000
        accountLabel:
          type: string
          minLength: 1
          maxLength: 120
        requiredAccountKind:
          type: string
          enum: [normal, cloudfront]
        sshPort:
          type: integer
          minimum: 1
          maximum: 65535
        mode:
          type: string
          enum: [PROXY, PROXY_SNI]
        proxyHost:
          type: string
          minLength: 1
          maxLength: 255
        proxyPort:
          type: integer
          minimum: 1
          maximum: 65535
        payload:
          type: string
          minLength: 1
          maxLength: 16000
        sniPolicy:
          type: string
          enum: [none, account_host, custom]
        customSni:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
        usePayload:
          type: boolean
        ssl:
          type: boolean
        supportsDarkTunnel:
          type: boolean
        supportsHttpCustom:
          type: boolean
        version:
          type: integer
          minimum: 1

    AdminEasyInjectPreset:
      allOf:
        - $ref: "#/components/schemas/EasyInjectPreset"
        - type: object
          required: [isActive, isBuiltIn, sortOrder, createdAt, updatedAt]
          properties:
            isActive:
              type: boolean
            isBuiltIn:
              type: boolean
            sortOrder:
              type: integer
              minimum: 0
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    EasyInjectPresetConfigurationInput:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - accountLabel
        - requiredAccountKind
        - sshPort
        - mode
        - proxyHost
        - proxyPort
        - payload
        - sniPolicy
        - usePayload
        - ssl
        - supportsDarkTunnel
        - supportsHttpCustom
      properties:
        name:
          type: string
