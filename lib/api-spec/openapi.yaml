          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoucherBody"
      responses:
        "201":
          description: Created voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"

  /admin/vouchers/{id}:
    put:
      operationId: adminUpdateVoucher
      tags: [admin]
      summary: Update voucher (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVoucherBody"
      responses:
        "200":
          description: Updated voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
    delete:
      operationId: adminDeleteVoucher
      tags: [admin]
      summary: Delete voucher (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /vouchers/validate:
    post:
      operationId: validateVoucher
      tags: [orders]
      summary: Validate a voucher code
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateVoucherBody"
      responses:
        "200":
          description: Valid voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateVoucherResponse"
        "400":
