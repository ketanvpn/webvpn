openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: KETANTECH VPN Store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: products
    description: VPN products/packages
  - name: orders
    description: Orders and transactions
  - name: dynamic-vpn
    description: Dynamic VPN server purchasing and order history
  - name: accounts
    description: VPN accounts (user's active services)
  - name: balance
    description: User balance / topup
  - name: admin
    description: Admin operations
  - name: servers
    description: VPN servers management
  - name: dashboard
    description: Dashboard stats
  - name: bug-presets
    description: Bug presets and converter config
  - name: easy-inject-presets
    description: Managed Easy Inject presets for DarkTunnel and HTTP Custom

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ──────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Username/email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout (clear cookie)
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update current user profile (fullName, email)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  nullable: true
                email:
                  type: string
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change current user password
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Wrong current password or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/check-username:
    get:
      operationId: checkUsername
      tags: [auth]
      summary: Cek ketersediaan username, kembalikan saran jika sudah dipakai
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hasil cek username
          content:
            application/json:
              schema:
                type: object
                required: [available, suggestions]
                properties:
                  available:
                    type: boolean
                  suggestions:
                    type: array
                    items:
                      type: string
        "400":
          description: Username tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password/send-otp:
    post:
      operationId: forgotPasswordSendOtp
      tags: [auth]
      summary: Kirim OTP ke WhatsApp untuk reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [whatsapp]
              properties:
                whatsapp:
                  type: string
      responses:
        "200":
          description: OTP dikirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  simulateMode:
                    type: boolean
                  otp:
                    type: string
                    nullable: true
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Gagal kirim OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password/reset:
    post:
      operationId: forgotPasswordReset
      tags: [auth]
      summary: Reset password dengan kode OTP dari WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [whatsapp, otpCode, newPassword]
              properties:
                whatsapp:
                  type: string
                otpCode:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        "200":
          description: Password berhasil direset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: OTP tidak valid atau validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Akun tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Products ──────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List historical static VPN packages
      description: Compatibility endpoint for historical static packages. Create new purchases with POST /dynamic-vpn/orders.
      parameters:
        - name: protocol
          in: query
          schema:
            type: string
            enum: [ssh, vmess, vless, trojan, shadowsocks]
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Historical static product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get historical static VPN package detail
      description: Compatibility endpoint for a historical static package. Create new purchases with POST /dynamic-vpn/orders.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Historical static product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Orders ────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List current user's orders
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, paid, failed, expired]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Retired static product purchase endpoint
      deprecated: true
      description: Static product purchases have been retired. Use POST /dynamic-vpn/orders for new purchases.
      security:
        - cookieAuth: []
      responses:
        "410":
          description: Static purchases are retired; use POST /dynamic-vpn/orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order detail
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/pay:
    post:
      operationId: payOrder
      tags: [orders]
      summary: Retired static order payment endpoint
      deprecated: true
      description: Static order payments are retired. Use GET /orders for history and POST /dynamic-vpn/orders for new purchases.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "410":
          description: Static order payments are retired; use order history or dynamic ordering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Balance / Topup ───────────────────────────────────────────────────
  /balance:
    get:
      operationId: getBalance
      tags: [balance]
      summary: Get current user's balance
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Balance info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"

  /balance/topup:
    post:
      operationId: topupBalance
      tags: [balance]
      summary: Request a QRIS topup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupBody"
      responses:
        "201":
          description: Topup request created with QRIS code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupResponse"

  /balance/topup/history:
    get:
      operationId: listTopupHistory
      tags: [balance]
      summary: Get topup history
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Topup history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopupTransaction"

  /balance/logs:
    get:
      operationId: listBalanceLogs
      tags: [balance]
      summary: Get balance transaction logs
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Balance logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceLogList"

  # ─── Accounts (VPN) ────────────────────────────────────────────────────
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List current user's active VPN accounts
      security:
        - cookieAuth: []
      responses:
        "200":
          description: VPN account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VpnAccount"

  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get VPN account detail
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnAccount"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts/{id}/renew:
    post:
      operationId: renewAccount
      tags: [accounts]
      summary: Retired static product renewal endpoint
      deprecated: true
      description: Static product renewals are retired. Create a new account through POST /dynamic-vpn/orders.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "410":
          description: Static renewals are retired; create a new account through POST /dynamic-vpn/orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dashboard summary ─────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get user dashboard summary (balance, active accounts, recent orders)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ─── Admin: Dashboard ──────────────────────────────────────────────────
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Admin dashboard stats
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  # ─── Admin: Users ──────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [user, reseller, admin]
          description: Filter by role
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"

  /admin/users/{id}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Get user detail (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Hapus user beserta semua data terkait (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update user (admin) — adjust balance, lock/unlock, set role
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/{id}/reset-password:
    post:
      operationId: adminResetUserPassword
      tags: [admin]
      summary: Reset password user (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  minLength: 6
      responses:
        "200":
          description: Password berhasil direset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /admin/users/{id}/balance-logs:
    get:
      operationId: adminGetUserBalanceLogs
      tags: [admin]
      summary: Get balance logs for a specific user (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Balance logs for the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceLogList"

  # ─── Admin: Products ───────────────────────────────────────────────────
  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: List all products (admin)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: adminCreateProduct
      tags: [admin]
      summary: Retired static product creation endpoint
      deprecated: true
      description: Static product mutations are retired. GET /admin/products remains available for history and audit.
      security:
        - cookieAuth: []
      responses:
        "410":
          description: Static product mutations are retired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetiredRouteResponse"

  /accounts/{id}/renew-dynamic/quote:
    post:
      operationId: quoteDynamicAccountRenewal
      tags: [accounts, dynamic-vpn]
      summary: Quote a balance-funded renewal for a dynamic VPN account
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicRenewalBody"
      responses:
        "200":
          description: Dynamic renewal price quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicRenewalQuote"
        "400":
          description: Invalid duration or account cannot be renewed dynamically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts/{id}/sync-provider:
    post:
      operationId: syncDynamicAccountProvider
      tags: [accounts, dynamic-vpn]
      summary: Synchronize a NadiaVPN dynamic account from its provider
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Synchronized VPN account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnAccount"
        "400":
          description: Account is not a synchronizable NadiaVPN dynamic account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts/{id}/renew-dynamic:
    post:
      operationId: renewDynamicAccount
      tags: [accounts, dynamic-vpn]
      summary: Renew a dynamic VPN account using balance
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicRenewalBody"
      responses:
        "200":
          description: Dynamic account renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicRenewalResponse"
        "400":
          description: Invalid renewal request or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Renewal already in progress for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Dynamic renewal failed after the request was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dynamic VPN ───────────────────────────────────────────────────────
  /dynamic-vpn/public-servers:
    get:
      operationId: listPublicDynamicVpnServers
      tags: [dynamic-vpn]
      summary: List active dynamic VPN servers for public display
      responses:
        "200":
          description: Active dynamic servers, including servers currently at capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicVpnServerListResponse"

  /dynamic-vpn/servers:
    get:
      operationId: listDynamicVpnServers
      tags: [dynamic-vpn]
      summary: List purchasable dynamic VPN servers
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active dynamic servers with available capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicVpnServerListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dynamic-vpn/quote:
    post:
      operationId: quoteDynamicVpnOrder
      tags: [dynamic-vpn]
      summary: Quote a dynamic VPN purchase
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicVpnQuoteBody"
      responses:
        "200":
          description: Dynamic VPN price quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicVpnQuote"
        "400":
          description: Invalid server, protocol, duration, or voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Dynamic server is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dynamic-vpn/orders:
    get:
      operationId: listDynamicVpnOrders
      tags: [dynamic-vpn]
      summary: List the current user's dynamic VPN orders
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Dynamic VPN order history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicVpnOrderListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
