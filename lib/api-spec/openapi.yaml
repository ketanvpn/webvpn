      responses:
        "200":
          description: Updated Telegram settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSettings"

  /admin/settings/reseller:
    get:
      operationId: adminGetResellerSettings
      tags: [admin]
      summary: Get reseller program settings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Reseller settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResellerSettings"
    put:
      operationId: adminUpdateResellerSettings
      tags: [admin]
      summary: Update reseller program settings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerSettings"
      responses:
        "200":
          description: Updated reseller settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResellerSettings"

  /admin/broadcast:
    post:
