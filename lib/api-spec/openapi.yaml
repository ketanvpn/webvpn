          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Bug Presets ──────────────────────────────────────────────────────
  /bug-presets:
    get:
      operationId: listBugPresets
      tags: [bug-presets]
      summary: List all active bug presets for users
      responses:
        "200":
          description: List of bug presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BugPreset"

  /admin/bug-presets:
    get:
      operationId: adminListBugPresets
      tags: [admin]
      summary: List all bug presets (admin)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of bug presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BugPreset"
    post:
      operationId: adminCreateBugPreset
      tags: [admin]
      summary: Create a new bug preset (admin)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBugPresetBody"
      responses:
        "201":
          description: Bug preset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugPreset"

  /admin/bug-presets/{id}:
    put:
      operationId: adminUpdateBugPreset
      tags: [admin]
      summary: Update a bug preset (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBugPresetBody"
      responses:
        "200":
          description: Bug preset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugPreset"
    delete:
      operationId: adminDeleteBugPreset
      tags: [admin]
      summary: Delete a bug preset (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bug preset deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  schemas:
    BalanceLog:
      type: object
      required: [id, userId, type, amount, balanceBefore, balanceAfter, description, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
          nullable: true
        type:
          type: string
          description: "Jenis transaksi: topup | order | adjustment | refund"
        amount:
          type: number
          description: "Jumlah perubahan (positif = masuk, negatif = keluar)"
        balanceBefore:
          type: number
        balanceAfter:
          type: number
        description:
          type: string
        relatedId:
          type: integer
          nullable: true
          description: "ID topup atau order terkait"
        createdAt:
          type: string
          format: date-time

    BalanceLogList:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BalanceLog"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PaymentSettings:
      type: object
      properties:
        qrisStaticUrl:
          type: string
          nullable: true
          description: URL gambar QRIS statis untuk topup manual
        qrisEnabled:
          type: boolean
          description: Aktifkan metode QRIS statis
        qrisExpiryMinutes:
          type: integer
          nullable: true
          description: Durasi QRIS statis berlaku dalam menit (default 15)
        autoGopayEnabled:
          type: boolean
          description: Aktifkan integrasi AutoGoPay
        autoGopayApiUrl:
          type: string
          nullable: true
          description: Base URL API AutoGoPay
        autoGopayMerchantId:
          type: string
          nullable: true
          description: Merchant ID AutoGoPay
        autoGopaySecretKey:
          type: string
          nullable: true
          description: API Key AutoGoPay (untuk auth dan verifikasi webhook)
        autoGopayCallbackToken:
          type: string
          nullable: true
          description: Token verifikasi callback/webhook AutoGoPay
        activeGateway:
          type: string
          nullable: true
          description: "Gateway aktif: 'qris_static' | 'autogopay'"
          enum: [qris_static, autogopay]

    TelegramSettings:
      type: object
      properties:
        telegramBotToken:
          type: string
          nullable: true
          description: Telegram Bot API token dari BotFather
        telegramAdminChatId:
          type: string
          nullable: true
          description: Chat ID Telegram admin untuk menerima notifikasi
        telegramEnabled:
          type: boolean
          description: Aktifkan notifikasi Telegram
        telegramBotUsername:
          type: string
          nullable: true
          description: Username bot (auto-detect)

    ResellerSettings:
      type: object
      properties:
        resellerEnabled:
          type: boolean
          description: Aktifkan fitur harga khusus reseller
        resellerDiscountPercent:
          type: integer
          description: Persentase diskon untuk reseller (0-100)
        resellerTargetEnabled:
          type: boolean
          description: Aktifkan sistem target penjualan bulanan
        resellerMonthlyTarget:
          type: integer
          description: Target penjualan bulanan dalam rupiah

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ─── Auth ─────────────────────────────────────────────────────────────
    RegisterBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6
        email:
          type: string
          format: email
        fullName:
          type: string
        whatsapp:
          type: string
        otpCode:
          type: string

    LoginBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, username, email, role, balance, isActive, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, reseller, admin]
        balance:
          type: number
          description: Balance in IDR
        isActive:
          type: boolean
        referralCode:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
          description: Nomor WhatsApp user
        telegramId:
          type: integer
          nullable: true
          description: Telegram user ID (linked)
        telegramUsername:
          type: string
          nullable: true
          description: Username Telegram user
        referredBy:
          type: string
          nullable: true
          description: Kode referral yang digunakan saat daftar
        createdAt:
          type: string
          format: date-time

    # ─── Products ─────────────────────────────────────────────────────────
    Product:
      type: object
      required: [id, name, protocol, durationDays, price, isActive, stock, availableStock]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        protocol:
          type: string
          enum: [ssh, vmess, vless, trojan, shadowsocks]
        durationDays:
          type: integer
        price:
          type: number
        quota:
          type: number
          nullable: true
          description: Bandwidth quota in GB, null = unlimited
        maxConnections:
          type: integer
          nullable: true
        stock:
          type: integer
          description: Batas maksimal akun aktif untuk produk ini
        availableStock:
          type: integer
          description: Sisa stok yang masih tersedia (stock - akun aktif)
        resellerPrice:
          type: number
          nullable: true
          description: Harga khusus reseller (null jika user bukan reseller atau fitur reseller nonaktif)
        isActive:
          type: boolean
        category:
          type: string
          nullable: true
        sortOrder:
          type: integer
        serverId:
          type: integer
          nullable: true
          description: ID server yang di-pin untuk produk ini (null = pilih otomatis)
        serverName:
          type: string
          nullable: true
          description: Nama server yang di-pin (null jika tidak di-pin)

    CreateProductBody:
      type: object
      required: [name, protocol, durationDays, price, stock]
      properties:
        name:
          type: string
        description:
          type: string
        protocol:
          type: string
          enum: [ssh, vmess, vless, trojan, shadowsocks]
        durationDays:
          type: integer
        price:
          type: number
        quota:
          type: number
          nullable: true
        maxConnections:
          type: integer
          nullable: true
        stock:
          type: integer
          description: Batas maksimal akun aktif
        isActive:
          type: boolean
          default: true
        category:
          type: string
        sortOrder:
          type: integer
          default: 0
        serverId:
          type: integer
          nullable: true
          description: ID server yang di-pin untuk produk ini (null = pilih otomatis)

    UpdateProductBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        protocol:
          type: string
          enum: [ssh, vmess, vless, trojan, shadowsocks]
        durationDays:
          type: integer
        price:
          type: number
        quota:
          type: number
          nullable: true
        maxConnections:
          type: integer
          nullable: true
        stock:
          type: integer
          description: Batas maksimal akun aktif
        isActive:
          type: boolean
        category:
          type: string
        sortOrder:
          type: integer
        serverId:
          type: integer
          nullable: true
          description: ID server yang di-pin untuk produk ini (null = pilih otomatis)

    # ─── Orders ───────────────────────────────────────────────────────────
    Order:
      type: object
      required: [id, userId, productId, status, amount, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        productId:
          type: integer
        product:
          $ref: "#/components/schemas/Product"
          nullable: true
        status:
          type: string
          enum: [pending, paid, failed, expired]
        amount:
          type: number
        vpnAccountId:
          type: integer
          nullable: true
        paymentMethod:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        qrisUrl:
          type: string
          nullable: true
          description: URL gambar QRIS (hanya untuk paymentMethod=qris via AutoGoPay)
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu kedaluwarsa QRIS
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrderBody:
      type: object
      required: [productId, remarks]
      properties:
        productId:
          type: integer
        serverId:
          type: integer
          nullable: true
        paymentMethod:
          type: string
          enum: [balance, qris]
          default: balance
        remarks:
          type: string
          minLength: 5
          pattern: '^(?=(?:.*[a-zA-Z]))(?=(?:.*[0-9]){2,})[a-zA-Z0-9]{5,}$'
          description: "Nama akun VPN unik. Wajib minimal 5 karakter, hanya huruf dan angka (minimal 2 angka). Contoh: daaw12"
        voucherCode:
          type: string
          nullable: true

    OrderListResponse:
      type: object
      required: [orders, total]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer

    AdminOrderListResponse:
      type: object
      required: [orders, total]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrder"
        total:
          type: integer

    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
              nullable: true

    # ─── Balance / Topup ──────────────────────────────────────────────────
    BalanceResponse:
      type: object
      required: [balance]
      properties:
        balance:
          type: number
        pendingTopup:
          type: number

    TopupBody:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 10000
          description: Amount in IDR (minimum 10,000)

    TopupResponse:
      type: object
      required: [id, amount, qrisUrl, status]
      properties:
        id:
          type: integer
        amount:
          type: number
        qrisUrl:
          type: string
          nullable: true
          description: URL of QRIS payment image
        expiresAt:
          type: string
          format: date-time
          nullable: true
        gateway:
          type: string
          nullable: true
          description: "Gateway yang digunakan: 'qris_static' | 'autogopay'"
        status:
          type: string
          enum: [pending, confirmed, rejected]

    TopupTransaction:
      type: object
      required: [id, userId, amount, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
          nullable: true
        amount:
          type: number
        qrisUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, rejected]
        confirmedBy:
          type: integer
          nullable: true
        rejectionNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── VPN Accounts ─────────────────────────────────────────────────────
    VpnAccount:
      type: object
      required: [id, userId, protocol, username, server, expiresAt, isActive, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        orderId:
          type: integer
          nullable: true
        protocol:
          type: string
          enum: [ssh, vmess, vless, trojan, shadowsocks]
        username:
          type: string
        password:
          type: string
          nullable: true
        uuid:
          type: string
          nullable: true
        serverId:
          type: integer
        server:
          $ref: "#/components/schemas/PublicServer"
        configLink:
          type: string
          nullable: true
          description: Primary config link (TLS)
        allLinks:
          type: object
          nullable: true
          description: All config link variants (tls, none, grpc, uptls, upntls)
          additionalProperties:
            type: string
            nullable: true
        expiresAt:
          type: string
          format: date-time
        quota:
          type: number
          nullable: true
        usedQuota:
          type: number
          nullable: true
        productName:
          type: string
          nullable: true
          description: Nama paket produk yang dibeli
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    RenewAccountBody:
      type: object
      required: [productId]
      properties:
        productId:
          type: integer

    # ─── Servers ──────────────────────────────────────────────────────────
    PublicServer:
      type: object
      required: [id, name, location, flag, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        host:
          type: string
          nullable: true
        location:
          type: string
        flag:
          type: string
          description: Country flag emoji or code
        isActive:
          type: boolean

    VpnServer:
      allOf:
        - $ref: "#/components/schemas/PublicServer"
        - type: object
          required: [host, supportedProtocols]
          properties:
            host:
              type: string
            apiUrl:
              type: string
              nullable: true
            apiToken:
              type: string
              nullable: true
            supportedProtocols:
              type: array
              items:
                type: string
            activeAccounts:
              type: integer
              nullable: true
            maxAccounts:
              type: integer
              nullable: true
              description: Kapasitas maksimum akun aktif di server ini

    CreateServerBody:
      type: object
      required: [name, location, flag, host, supportedProtocols]
      properties:
        name:
          type: string
        location:
          type: string
        flag:
          type: string
        host:
          type: string
        apiUrl:
          type: string
        apiToken:
          type: string
        supportedProtocols:
          type: array
          items:
            type: string
        isActive:
          type: boolean
          default: true
        maxAccounts:
          type: integer
          description: Kapasitas maksimum akun aktif di server ini
          default: 500

    UpdateServerBody:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        flag:
          type: string
        host:
          type: string
        apiUrl:
          type: string
        apiToken:
          type: string
        supportedProtocols:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        maxAccounts:
          type: integer
          description: Kapasitas maksimum akun aktif di server ini

    # ─── Dashboard ────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [balance, activeAccounts, totalOrders, recentOrders]
      properties:
        balance:
          type: number
        activeAccounts:
          type: integer
        totalOrders:
          type: integer
        pendingTopup:
          type: number
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        expiringAccounts:
          type: array
          items:
            $ref: "#/components/schemas/VpnAccount"
          description: Accounts expiring within 3 days

    AdminDashboard:
      type: object
      required: [totalUsers, totalOrders, totalRevenue, activeAccounts, pendingTopups, pendingOrders, recentOrders, recentTopups]
      properties:
        totalUsers:
          type: integer
        totalOrders:
          type: integer
        totalRevenue:
          type: number
        activeAccounts:
          type: integer
        pendingTopups:
          type: integer
        pendingOrders:
          type: integer
        revenueToday:
          type: number
        revenueThisMonth:
          type: number
        ordersByProtocol:
          type: array
          items:
            type: object
            required: [protocol, count]
            properties:
              protocol:
                type: string
              count:
                type: integer
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrder"
        recentTopups:
          type: array
          items:
            $ref: "#/components/schemas/TopupTransaction"

    AdminUserListResponse:
      type: object
      required: [users, total]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer

    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            orders:
              type: array
              items:
                $ref: "#/components/schemas/Order"
            accounts:
              type: array
              items:
                $ref: "#/components/schemas/VpnAccount"
            topupHistory:
              type: array
              items:
                $ref: "#/components/schemas/TopupTransaction"

    AdminAccountListResponse:
      type: object
      required: [accounts, total]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AdminVpnAccount"
        total:
          type: integer

    AdminVpnAccount:
      allOf:
        - $ref: "#/components/schemas/VpnAccount"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
              nullable: true

    AdminUpdateUserBody:
      type: object
      properties:
        balance:
          type: number
        isActive:
          type: boolean
        role:
          type: string
          enum: [user, reseller, admin]
        adjustBalance:
          type: number
          description: Add/subtract from balance (positive = add, negative = subtract)

    Voucher:
      type: object
      required: [id, code, discountType, discountValue, currentUses, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        code:
          type: string
        discountType:
          type: string
          enum: [percent, fixed]
        discountValue:
          type: number
        maxUses:
          type: integer
          nullable: true
        currentUses:
          type: integer
        isActive:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateVoucherBody:
      type: object
      required: [code, discountType, discountValue]
      properties:
        code:
          type: string
        discountType:
          type: string
          enum: [percent, fixed]
        discountValue:
          type: number
        maxUses:
          type: integer
          nullable: true
        isActive:
          type: boolean
          default: true
        expiresAt:
          type: string
          format: date-time
          nullable: true

    UpdateVoucherBody:
      type: object
      properties:
        code:
          type: string
        discountType:
          type: string
          enum: [percent, fixed]
        discountValue:
          type: number
        maxUses:
          type: integer
          nullable: true
        isActive:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true

    ValidateVoucherBody:
      type: object
      required: [code, productId]
      properties:
        code:
          type: string
        productId:
          type: integer

    ValidateVoucherResponse:
      type: object
      required: [valid, discountAmount, finalPrice]
      properties:
        valid:
          type: boolean
        discountAmount:
          type: number
        finalPrice:
          type: number
        message:
          type: string

    # ─── Bug Presets ──────────────────────────────────────────────────────
    BugPreset:
      type: object
      required: [id, name, bugDomain, mode, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        bugDomain:
          type: string
        mode:
          type: string
          enum: [wildcard, sni, host]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBugPresetBody:
      type: object
      required: [name, bugDomain, mode]
      properties:
        name:
          type: string
        bugDomain:
          type: string
        mode:
          type: string
          enum: [wildcard, sni, host]
        isActive:
          type: boolean
          default: true

    UpdateBugPresetBody:
      type: object
      properties:
        name:
          type: string
        bugDomain:
          type: string
        mode:
          type: string
          enum: [wildcard, sni, host]
        isActive:
          type: boolean
