        fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- K letter inside shield -->
  <line x1="68" y1="68" x2="68" y2="118" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
  <line x1="68" y1="93" x2="112" y2="68" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
  <line x1="68" y1="93" x2="112" y2="118" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>

